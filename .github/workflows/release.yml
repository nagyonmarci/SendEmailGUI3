name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Security gate ────────────────────────────────────────────────────────────
  security:
    name: Security scan + version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit bandit

      - name: Validate tag matches VERSION file
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: Tag $GITHUB_REF_NAME != VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "Version check passed: $FILE_VERSION"

      - name: CVE audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: SAST scan (bandit, medium+ severity)
        run: bandit -r . -ll --exclude ./myenv,./buildenv,./dist,./build

  # ── macOS build ──────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    needs: security
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller SendEmailGUI3.spec

      - name: Zip .app bundle with installer
        run: |
          mkdir -p mac_release
          cp -R dist/SendEmailGUI3.app mac_release/
          cp install.sh mac_release/
          chmod +x mac_release/install.sh
          ditto -c -k --sequesterRsrc mac_release SendEmailGUI3-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SendEmailGUI3-mac
          path: SendEmailGUI3-mac.zip
          if-no-files-found: error

  # ── Windows x64 build ────────────────────────────────────────────────────────
  build-windows-x64:
    name: Build Windows x64
    needs: security
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-win.txt

      - name: Build with PyInstaller
        run: pyinstaller SendEmailGUI3-win-x64.spec

      - uses: actions/upload-artifact@v4
        with:
          name: SendEmailGUI3-win-x64
          path: dist/SendEmailGUI3-win-x64.exe
          if-no-files-found: error

  # ── Windows ARM64 build ──────────────────────────────────────────────────────
  build-windows-arm64:
    name: Build Windows ARM64
    needs: security
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-win.txt

      - name: Build with PyInstaller
        run: pyinstaller SendEmailGUI3-win-arm64.spec

      - uses: actions/upload-artifact@v4
        with:
          name: SendEmailGUI3-win-arm64
          path: dist/SendEmailGUI3-win-arm64.exe
          if-no-files-found: error

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows-x64, build-windows-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SendEmailGUI3 ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/SendEmailGUI3-mac/SendEmailGUI3-mac.zip
            artifacts/SendEmailGUI3-win-x64/SendEmailGUI3-win-x64.exe
            artifacts/SendEmailGUI3-win-arm64/SendEmailGUI3-win-arm64.exe
