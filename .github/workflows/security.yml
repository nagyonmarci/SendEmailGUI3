name: Security Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  security:
    name: pip-audit + bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit bandit

      - name: CVE audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: SAST scan (bandit, medium+ severity)
        run: bandit -r . -ll --exclude ./myenv,./buildenv,./dist,./build
